<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weathervane</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⛅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Weathervane — atmospheric weather instrument.
     Tokens first, dark by default, with an explicit light theme.
     ===================================================================== */
  :root {
    --bg: #0a0f1e;
    --bg-2: #0e1426;
    --surface: #121a30;
    --glass: rgba(18, 26, 48, 0.55);
    --glass-strong: rgba(18, 26, 48, 0.82);
    --line: rgba(214, 224, 245, 0.10);
    --line-strong: rgba(214, 224, 245, 0.20);
    --ink: #e9edf7;
    --ink-dim: #9aa7c2;
    --ink-faint: #6b7794;
    --accent: #ffc266;
    --accent-hi: #ffd89b;
    --on-accent: #2b1c06;
    --good: #5fd68a;
    --warn: #f2b84b;
    --bad: #f07c74;
    --focus: rgba(255, 194, 102, 0.5);
    --sun: #ffc266;
    --cloud: #aeb9d2;
    --rain: #7fb0e0;
    --storm: #b39bef;
    --snow: #cfe6f5;
    --mist: #b9b2cc;
    --shadow: 0 18px 50px rgba(3, 6, 16, 0.45);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --maxw: 1040px;
    --font-display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", "Cascadia Mono", ui-monospace, monospace;
    --mood-a: rgba(255, 195, 110, 0.16);
    --mood-b: rgba(94, 143, 255, 0.20);
    --mood-c: rgba(90, 86, 180, 0.18);
  }

  :root[data-theme="light"] {
    --bg: #e7ecf5;
    --bg-2: #eef2f9;
    --surface: #f7f9fd;
    --glass: rgba(255, 255, 255, 0.66);
    --glass-strong: rgba(255, 255, 255, 0.9);
    --line: rgba(15, 23, 42, 0.10);
    --line-strong: rgba(15, 23, 42, 0.18);
    --ink: #182032;
    --ink-dim: #59647e;
    --ink-faint: #8a94ad;
    --accent: #b25f09;
    --accent-hi: #d98c37;
    --on-accent: #ffffff;
    --good: #17894c;
    --warn: #a36909;
    --bad: #bf3e32;
    --focus: rgba(178, 95, 9, 0.42);
    --sun: #e0950f;
    --cloud: #66738f;
    --rain: #2f6fb2;
    --storm: #6f5bbf;
    --snow: #4b87ad;
    --mist: #7a718f;
    --shadow: 0 18px 50px rgba(40, 55, 90, 0.16);
    --mood-a: rgba(200, 150, 60, 0.10);
    --mood-b: rgba(90, 130, 210, 0.12);
    --mood-c: rgba(110, 110, 200, 0.10);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #e7ecf5;
      --bg-2: #eef2f9;
      --surface: #f7f9fd;
      --glass: rgba(255, 255, 255, 0.66);
      --glass-strong: rgba(255, 255, 255, 0.9);
      --line: rgba(15, 23, 42, 0.10);
      --line-strong: rgba(15, 23, 42, 0.18);
      --ink: #182032;
      --ink-dim: #59647e;
      --ink-faint: #8a94ad;
      --accent: #b25f09;
      --accent-hi: #d98c37;
      --on-accent: #ffffff;
      --good: #17894c;
      --warn: #a36909;
      --bad: #bf3e32;
      --focus: rgba(178, 95, 9, 0.42);
      --sun: #e0950f;
      --cloud: #66738f;
      --rain: #2f6fb2;
      --storm: #6f5bbf;
      --snow: #4b87ad;
      --mist: #7a718f;
      --shadow: 0 18px 50px rgba(40, 55, 90, 0.16);
      --mood-a: rgba(200, 150, 60, 0.10);
      --mood-b: rgba(90, 130, 210, 0.12);
      --mood-c: rgba(110, 110, 200, 0.10);
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

  /* ---------- Sky backdrop ---------- */
  #sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  #sky .blob {
    position: absolute; border-radius: 50%; filter: blur(90px);
    opacity: 0.9; transition: background 1.6s ease;
    will-change: transform;
  }
  #sky .blob.b1 { width: 55vmax; height: 55vmax; top: -24vmax; left: -16vmax; background: var(--mood-a); }
  #sky .blob.b2 { width: 46vmax; height: 46vmax; bottom: -20vmax; right: -12vmax; background: var(--mood-b); }
  #sky .blob.b3 { width: 30vmax; height: 30vmax; top: 30%; left: 55%; background: var(--mood-c); }

  @media (prefers-reduced-motion: no-preference) {
    #sky .blob { animation: drift 34s ease-in-out infinite alternate; }
    #sky .blob.b2 { animation-duration: 44s; animation-delay: -8s; }
    #sky .blob.b3 { animation-duration: 38s; animation-delay: -18s; }
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(4vmax, 3vmax, 0) scale(1.12); }
  }

  /* ---------- Layout shell ---------- */
  .shell {
    position: relative; z-index: 1;
    max-width: var(--maxw); margin: 0 auto; padding: 0 22px 72px;
    display: grid; gap: 26px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 22px 0 8px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 1.18rem; letter-spacing: 0.01em;
    color: var(--ink); text-decoration: none;
  }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent-hi), var(--accent));
    color: var(--on-accent);
  }
  .brand .mark svg { width: 18px; height: 18px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .clock {
    font-family: var(--font-data); font-size: 0.8rem; color: var(--ink-dim);
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .unit-toggle {
    display: inline-flex; padding: 3px; gap: 2px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    background: var(--glass);
  }
  .unit-toggle button {
    border: 0; background: transparent; color: var(--ink-dim);
    font-family: var(--font-data); font-size: 0.75rem; font-weight: 500;
    padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease;
  }
  .unit-toggle button[aria-pressed="true"] {
    background: var(--accent); color: var(--on-accent);
  }
  .theme-switch {
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--glass);
    color: var(--ink-dim); width: 34px; height: 34px; display: grid; place-items: center;
    cursor: pointer; font-size: 15px; transition: all 0.18s ease;
  }
  .theme-switch:hover { color: var(--ink); }

  /* ---------- Search ---------- */
  .searchbar { position: relative; z-index: 5; }
  .searchbar form {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 18px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
    background: var(--glass-strong); backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
  }
  .searchbar svg.search-ic { width: 20px; height: 20px; color: var(--ink-faint); flex: 0 0 auto; }
  .searchbar input {
    flex: 1; min-width: 0;
    background:transparent; border: 0; outline: none;
    color: var(--ink); font: 500 1rem var(--font-body);
    padding: 8px 0;
  }
  .searchbar input::placeholder { color: var(--ink-faint); }
  .searchbar button[type="submit"] {
    border: 0; cursor: pointer;
    background: var(--accent); color: var(--on-accent);
    font: 600 0.85rem var(--font-body);
    padding: 10px 18px; border-radius: var(--radius-md);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .searchbar button[type="submit"]:hover { background: var(--accent-hi); }
  .searchbar button[type="submit"]:active { transform: scale(0.97); }

  /* Autocomplete */
  .suggest {
    position: absolute; inset: calc(100% + 8px) 0 auto; z-index: 20;
    display: none; flex-direction: column; gap: 2px;
    background: var(--glass-strong); backdrop-filter: blur(16px);
    border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    box-shadow: var(--shadow); padding: 6px; overflow: hidden;
  }
  .suggest.open { display: flex; }
  .suggest button {
    text-align: left; border: 0; background: transparent; cursor: pointer;
    color: var(--ink); font: 500 0.92rem var(--font-body);
    padding: 10px 12px; border-radius: var(--radius-sm);
    display: flex; align-items: baseline; gap: 8px;
  }
  .suggest button:hover, .suggest button[aria-selected="true"] { background: var(--line); }
  .suggest .loc { color: var(--ink); }
  .suggest .sub { color: var(--ink-faint); font-size: 0.78rem; font-family: var(--font-data); }

  /* ---------- Cards / sections ---------- */
  .card {
    border: 1px solid var(--line);
    background: var(--glass); backdrop-filter: blur(14px);
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
  }
  .eyebrow {
    font-family: var(--font-data); font-size: 0.68rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0;
  }

  /* Hero */
  #hero { padding: 30px 30px 26px; overflow: hidden; position: relative; }
  #hero .hero-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  #hero h1 {
    margin: 4px 0 0; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.7rem, 3.4vw, 2.5rem); letter-spacing: -0.02em; text-wrap: balance;
  }
  #hero .city-flag {
    display: inline-block; margin-left: 10px; font-size: 1.05rem; vertical-align: 0.1em;
  }
  #hero .condition { margin: 6px 0 0; color: var(--ink-dim); font-weight: 500; }
  #hero .searched { color: var(--ink-faint); font-family: var(--font-data); font-size: 0.74rem; }

  .hero-grid {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px 34px;
    margin-top: 22px;
  }
  .temp-wrap { display: flex; align-items: flex-start; }
  .temp-wrap .glyph { width: 92px; height: 92px; margin-right: -6px; }
  .temp {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(4rem, 10vw, 6.4rem); line-height: 1;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }
  .temp .deg { color: var(--ink-dim); font-weight: 600; font-size: 2rem; vertical-align: 0.9em; margin-left: 4px; }
  .feels {
    color: var(--ink-faint); font-size: 0.86rem; margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* Instrument row (daylight arc + stats) */
  .instruments {
    display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr));
    gap: 14px; margin-top: 26px; padding-top: 20px;
    border-top: 1px dashed var(--line-strong);
  }
  .instrument { display: grid; gap: 6px; align-content: start; }
  .instrument .num {
    font-family: var(--font-data); font-size: 1.22rem; font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .instrument .num small { font-size: 0.68rem; color: var(--ink-faint); margin-left: 2px; }
  .instrument .label {
    font-family: var(--font-data); font-size: 0.64rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  .daylight { display: grid; gap: 8px; }
  .daylight svg { width: 100%; max-width: 340px; height: auto; display: block; }
  .daylight .dl-row { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.72rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .daylight .dl-row b { color: var(--ink); font-weight: 500; }

  /* Forecast strip */
  #forecast { padding: 24px 26px 22px; }
  #forecast .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  #forecast .head h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
  .day-card {
    border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--surface); padding: 14px 14px 12px;
    display: grid; gap: 8px; align-content: start;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .day-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .day-card .d-name { font-weight: 600; font-size: 0.9rem; }
  .day-card .d-date { color: var(--ink-faint); font-family: var(--font-data); font-size: 0.68rem; }
  .day-card .glyph { width: 44px; height: 44px; margin: 2px 0; }
  .day-card .d-cond { color: var(--ink-dim); font-size: 0.78rem; line-height: 1.2; min-height: 2.2em; }
  .day-card .d-temps { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .day-card .d-high { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; }
  .day-card .d-low { color: var(--ink-faint); font-family: var(--font-data); font-size: 0.82rem; }

  /* History */
  #history { padding: 24px 26px 20px; }
  #history .head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  #history .head h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
  .ghost-btn {
    border: 1px solid var(--line-strong); background: transparent; color: var(--ink-dim);
    font: 500 0.8rem var(--font-body); padding: 7px 13px; border-radius: 999px; cursor: pointer;
    transition: all 0.18s ease;
  }
  .ghost-btn:hover { color: var(--bad); border-color: var(--bad); }
  .ghost-btn:disabled { opacity: 0.45; cursor: default; }
  .history-list { display: grid; gap: 8px; }
  .history-list button {
    text-align: left; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: var(--radius-sm); padding: 11px 14px; cursor: pointer;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .history-list button:hover { border-color: var(--line-strong); background: var(--line); }
  .history-list .h-city { font-weight: 600; }
  .history-list .h-when { color: var(--ink-faint); font-family: var(--font-data); font-size: 0.7rem; margin-left: auto; }
  .empty {
    color: var(--ink-faint); font-size: 0.88rem; padding: 14px 4px 6px;
  }

  /* Loading shimmer */
  .shimmer { position: relative; overflow: hidden; }
  .shimmer::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  [data-theme="light"] .shimmer::after { background: linear-gradient(90deg, transparent, rgba(20,30,60,0.07), transparent); }

  /* States */
  .idle-state {
    text-align: center; padding: 52px 22px; color: var(--ink-faint);
  }
  .idle-state .big { font-size: 40px; margin-bottom: 8px; }
  .idle-state strong { color: var(--ink-dim); display: block; font-family: var(--font-body); font-weight: 600; }
  .notice {
    display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    padding: 14px 16px; background: var(--surface);
  }
  .notice[data-tone="bad"] { border-color: var(--bad); }
  .notice[data-tone="bad"] .nt { color: var(--bad); }
  .notice .nt { font-family: var(--font-data); font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .notice p { margin: 0; color: var(--ink-dim); font-size: 0.92rem; }
  .notice button { margin-top: 10px; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    z-index: 40; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
    background: var(--glass-strong); backdrop-filter: blur(12px);
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 10px 18px; font-size: 0.86rem; color: var(--ink); box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer {
    max-width: var(--maxw); margin: 0 auto; padding: 8px 22px 34px; text-align: center;
    color: var(--ink-faint); font-size: 0.74rem; font-family: var(--font-data);
  }

  @media (max-width: 820px) {
    .hero-grid { grid-template-columns: 1fr; gap: 8px 0; }
    .instruments { grid-template-columns: repeat(2, 1fr); }
    .topbar { flex-wrap: wrap; }
  }
  @media (max-width: 520px) {
    .shell { padding-inline: 14px; }
    .clock { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* .glyph color slots per weather family */
  .glyph { display: block; }
  .gp-sun { color: var(--sun); }
  .gp-cloud { color: var(--cloud); }
  .gp-rain { color: var(--rain); }
  .gp-storm { color: var(--storm); }
  .gp-snow { color: var(--snow); }
  .gp-mist { color: var(--mist); }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <header class="shell topbar">
    <a class="brand" href="#" aria-label="Weathervane home">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M19.1 4.9l-1.4 1.4 M6.3 17.7l-1.4 1.4"/>
        </svg>
      </span>
      Weathervane
    </a>
    <div class="topbar-right">
      <time class="clock" id="clock"></time>
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="c" aria-pressed="true">°C</button>
        <button type="button" data-unit="f" aria-pressed="false">°F</button>
      </div>
      <button class="theme-switch" id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">☾</button>
    </div>
  </header>

  <div class="shell">
    <section class="searchbar" aria-label="Search a city">
      <form id="search-form" role="search">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="city-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a city, e.g. Hyderabad" aria-label="City name"
               aria-autocomplete="list" aria-controls="suggest" role="combobox" aria-expanded="false">
        <button type="submit">Look up</button>
        <div id="suggest" class="suggest" role="listbox"></div>
      </form>
    </section>

    <main id="app">
      <section id="hero" class="card" aria-live="polite">
        <div class="idle-state">
          <div class="big">☁</div>
          <strong>Look up a city to see its sky.</strong>
          <p style="margin:6px 0 0; font-size:0.85rem;">Try <em>Hyderabad</em>, <em>London</em>, or <em>Tokyo</em>.</p>
        </div>
      </section>

      <section id="forecast" class="card" hidden aria-label="Five day forecast"></section>

      <section id="history" class="card" aria-label="Search history">
        <div class="head">
          <h2>Recent lookups</h2>
          <button class="ghost-btn" id="clear-history" type="button">Clear history</button>
        </div>
        <div id="history-list"><p class="empty">No searches yet — your lookups will appear here.</p></div>
      </section>
    </main>

    <footer>Weathervane · OpenWeather data · CLI and web share the same history file</footer>
  </div>

  <div id="toast" role="status"></div>

<script>
/* =====================================================================
   Weathervane front-end
   USE_MOCK — when true, this page runs on curated demo data with no server
   (used for the standalone preview artifact). The Flask app ships this same
   file with USE_MOCK = false and talks to /api/...
   ===================================================================== */
const USE_MOCK = false;

const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const state = {
  unit: "c",                    // c | f
  weather: null,

/* ---------- theme ---------- */
function applyTheme(theme) {
  const html = document.documentElement;
  html.setAttribute("data-theme", theme);
  saveStorage("wv-theme", theme);
  $("#theme-toggle").textContent = theme === "dark" ? "☾" : "☀";
  $("#theme-toggle").setAttribute("aria-label", "Switch to " + (theme === "dark" ? "light" : "dark") + " theme");
}
$("#theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
});
(function initTheme() {
  const saved = loadStorage("wv-theme", null);
  if (saved) return applyTheme(saved);
  const prefers = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(prefers);
})();

  rain: `<svg class="gp-rain" viewBox="0 0 48 48" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path class="gp-cloud" d="M14 27a7 7 0 0 1-.6-13.9A9.5 9.5 0 0 1 31 15.6 6.5 6.5 0 0 1 37 28h-1" stroke="currentColor"/><path d="M19 34l-2.4 5 M27 34l-2.4 5 M35 34l-2.4 5" stroke="currentColor"/></svg>`,
  snow: `<svg class="gp-snow" viewBox="0 0 48 48" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path class="gp-cloud" d="M14 27a7 7 0 0 1-.6-13.9A9.5 9.5 0 0 1 31 15.6 6.5 6.5 0 0 1 37 28h-1" stroke="currentColor"/><path d="M18 35l-1.5 1.8 M24 35l-1.5 1.8 M30 35l-1.5 1.8 M17 41l-1.5-1.8 M23 41l-1.5-1.8 M29 41l-1.5-1.8" stroke="currentColor"/></svg>`,
  storm: `<svg class="gp-storm" viewBox="0 0 48 48" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path class="gp-cloud" d="M13 24a7 7 0 0 1-.5-13.8A9.5 9.5 0 0 1 30 12.7 6.5 6.5 0 0 1 36 26h-1" stroke="currentColor"/><path d="M26 30l-5 9h4l-2.5 7 8-11h-5l4-6z" fill="currentColor" stroke="none"/></svg>`,
  mist: `<svg class="gp-mist" viewBox="0 0 48 48" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M12 16h24 M12 24h24 M12 32h24 M12 40h18" stroke="currentColor"/></svg>`,

/* icon code (OpenWeather e.g. "01d") → glyph family + sky mood */
const OW = {
  "01": { g: (n) => n ? "moon" : "sun", m: "clear" },
  "02": { g: () => "partly", m: "clouds" },
  "03": { g: () => "cloud", m: "clouds" },
  "04": { g: () => "cloud", m: "clouds" },
  "09": { g: () => "rain", m: "rain" },
  "10": { g: () => "rain", m: "rain" },
  "11": { g: () => "storm", m: "storm" },
  "13": { g: () => "snow", m: "snow" },
  "50": { g: () => "mist", m: "mist" },
};
function owMeta(icon) {
  const key = (icon || "01d").slice(0, 2);
  const meta = OW[key] || OW["01"];
  const night = (icon || "d").endsWith("n");
  return { glyph: typeof meta.g === "function" ? meta.g(night) : meta.g, mood: meta.m };
}

const MOODS = {
  clear:  ["rgba(255,195,110,0.16)", "rgba(94,143,255,0.20)", "rgba(90,86,180,0.18)"],
  clouds: ["rgba(158,180,205,0.15)", "rgba(120,132,158,0.17)", "rgba(90,96,120,0.22)"],
  rain:   ["rgba(110,168,190,0.15)", "rgba(90,120,180,0.20)", "rgba(70,80,150,0.24)"],
  storm:  ["rgba(150,120,220,0.16)", "rgba(110,90,170,0.22)", "rgba(70,60,130,0.28)"],
  snow:   ["rgba(190,220,240,0.14)", "rgba(150,180,210,0.18)", "rgba(110,140,180,0.22)"],
  mist:   ["rgba(190,180,210,0.13)", "rgba(150,145,175,0.16)", "rgba(110,105,135,0.20)"],
};
function setMood(mood) {
  const [a, b, c] = MOODS[mood] || MOODS.clear;
  const root = document.documentElement.style;
  root.setProperty("--mood-a", a);
  root.setProperty("--mood-b", b);
  root.setProperty("--mood-c", c);
}

/* ---------- units / formatting ---------- */
function fmtTemp(c) {
  const v = state.unit === "f" ? c * 9 / 5 + 32 : c;
  return Math.round(v);
}
function temp(c) {
  return String(fmtTemp(c)); // number only — callers add the "°" glyph
}
function weekday(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString([], { weekday: "short" });
}
function monthDay(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" });
}

/* ---------- daylight arc ---------- */
function parseHM(t) {
  const m = (t || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return null;
  let h = +m[1] % 12;
  if (m[3].toUpperCase() === "PM") h += 12;
  return h * 60 + +m[2];
}
function daylightArc(w) {
  const rise = parseHM(w.sunrise), set = parseHM(w.sunset);
  if (rise == null || set == null) {
    return `<svg viewBox="0 0 200 110" role="img" aria-label="Sunrise ${w.sunrise} to sunset ${w.sunset}">
      <path d="M20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
      <circle cx="20" cy="100" r="5" fill="var(--sun)"/><circle cx="180" cy="100" r="5" fill="var(--sun)"/>
      <path d="M20 96 L20 104" stroke="var(--sun)" stroke-width="2"/>
      <path d="M180 96 L180 104" stroke="var(--sun)" stroke-width="2"/>
    </svg>`;
  }
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const frac = Math.min(1, Math.max(0, (nowMin - rise) / (set - rise)));
  const cx = 20 + 160 * frac;
  const cy = 100 - Math.sin(frac * Math.PI) * 80;
  const arcId = "dl" + frac.toFixed(2).replace(".", "");
  return `<svg viewBox="0 0 200 110" role="img" aria-label="Sun up ${Math.round(frac * (set - rise) / 60)} of ${Math.round((set - rise) / 60)} hours">
    <defs><linearGradient id="${arcId}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--sun)"/><stop offset="1" stop-color="var(--accent-hi)"/>
    </linearGradient></defs>
    <path d="M20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--line-strong)" stroke-width="2.5"/>
    <path d="M20 100 A 80 80 0 0 1 100 20" fill="none" stroke="url(#${arcId})" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M20 96 L20 104" stroke="var(--sun)" stroke-width="2"/>
    <path d="M180 96 L180 104" stroke="var(--sun)" stroke-width="2"/>
    <circle cx="20" cy="100" r="4" fill="var(--sun)" stroke="var(--bg)" stroke-width="1.5"/>
    <circle cx="180" cy="100" r="4" fill="var(--sun)" stroke="var(--bg)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
  </svg>`;
}

/* ---------- API (real or mock) ---------- */
async function apiWeather(city) {
  if (USE_MOCK) return MOCK.weather(city);
  const res = await fetch("/api/weather?city=" + encodeURIComponent(city));
  return { status: res.status, body: await res.json() };
}
async function apiForecast(city) {
  if (USE_MOCK) return MOCK.forecast(city);
  const res = await fetch("/api/forecast?city=" + encodeURIComponent(city));
  return { status: res.status, body: await res.json() };
}
async function apiSuggest(q) {
  if (USE_MOCK) return MOCK.suggest(q);
  const res = await fetch("/api/geocode?q=" + encodeURIComponent(q));
  return res.ok ? await res.json() : [];
}
async function apiHistory() {
  if (USE_MOCK) return state.mockHistory;
  const res = await fetch("/api/history");
  return res.ok ? await res.json() : [];
}
async function apiClearHistory() {
  if (USE_MOCK) { state.mockHistory = []; saveStorage("wv-history", []); return; }
  await fetch("/api/history", { method: "DELETE" });
}

/* ---------- render ---------- */
function renderHero() {
  const w = state.weather;
  const meta = owMeta(w.icon);
  const hero = $("#hero");
  hero.classList.remove("shimmer");
  hero.innerHTML = `
    <div class="hero-top">
      <div>
        <p class="eyebrow">Now</p>
        <h1>${w.city}${w.country ? `<span class="city-flag">${flag(w.country)}</span>` : ""}</h1>
        <p class="condition">${w.condition}</p>
      </div>
      <div class="searched">searched ${w.searched_at}</div>
    </div>
    <div class="hero-grid">
      <div class="temp-wrap">
        <span class="glyph ${gpClass(meta.glyph)}">${GLYPH[meta.glyph]}</span>
        <div>
          <div class="temp" data-c="${w.temp_c}">${temp(w.temp_c)}<span class="deg">°</span></div>
          <p class="feels">Feels like <b data-c="${w.feels_like_c}">${temp(w.feels_like_c)}°</b></p>
        </div>
      </div>
      <div class="instruments">
        <div class="instrument daylight">
          <span class="label">Daylight</span>
          ${daylightArc(w)}
          <div class="dl-row"><span><b>↑</b> ${w.sunrise}</span><span><b>↓</b> ${w.sunset}</span></div>
        </div>
        <div class="instrument"><span class="label">Humidity</span><span class="num">${w.humidity}<small>%</small></span></div>
        <div class="instrument"><span class="label">Wind</span><span class="num">${fmtWind(w.wind_ms)}<small>m/s</small></span></div>
        <div class="instrument"><span class="label">Feels like</span><span class="num"><span data-c="${w.feels_like_c}">${temp(w.feels_like_c)}</span><small>°</small></span></div>
      </div>
    </div>`;
  setMood(meta.mood);
}
function gpClass(g) {
  return { sun: "gp-sun", moon: "gp-cloud", cloud: "gp-cloud", partly: "gp-sun", rain: "gp-rain", snow: "gp-snow", storm: "gp-storm", mist: "gp-mist" }[g];
}
function fmtWind(ms) {
  if (state.unit === "f") return (ms * 2.23694).toFixed(1);
  return Number.isInteger(ms) ? ms : ms.toFixed(1);
}

function renderForecast() {
  const f = $("#forecast");
  f.hidden = false;
  f.classList.remove("shimmer");
  f.innerHTML = `
    <div class="head">
      <h2>Five-day outlook · ${state.weather ? state.weather.city : ""}</h2>
    </div>
    <div class="days">
      ${state.results.map((d) => {
        const meta = owMeta(d.icon);
        return `<div class="day-card">
          <div class="d-name">${weekday(d.date)}</div>
          <div class="d-date">${monthDay(d.date)}</div>
          <span class="glyph ${gpClass(meta.glyph)}">${GLYPH[meta.glyph]}</span>
          <div class="d-cond">${d.condition}</div>
          <div class="d-temps">
            <span class="d-high" data-c="${d.temp_max_c}">${temp(d.temp_max_c)}°</span>
            <span class="d-low" data-c="${d.temp_min_c}">${temp(d.temp_min_c)}°</span>
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

function flag(cc) {
  if (!cc || cc.length !== 2) return "";
  const OFFSET = 127397;
  const points = [...cc.toUpperCase()].map((ch) => ch.charCodeAt(0) + OFFSET);
  return String.fromCodePoint(...points);
}

function renderHistory(entries) {
  const list = $("#history-list");
  const data = entries || [];
  if (!data.length) {
    list.innerHTML = `<p class="empty">No searches yet — your lookups will appear here.</p>`;
    return;
  }
  list.innerHTML = data.map((h) => `
    <button type="button" data-city="${esc(h.City || "")}" title="Look up ${esc(h.City || "")} again">
      <span class="h-city">${h.City || "—"}</span>
      <span>${h.Country || ""}</span>
      <span class="h-when">${esc(h.searched_at || "")}</span>
    </button>`).join("");
  $$("#history-list button").forEach((b) => b.addEventListener("click", () => {
    search($("#city-input").value = b.dataset.city);
    $("#city-input").value = b.dataset.city;
  }));
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- search flow ---------- */
async function search(city) {
  city = (city || "").trim();
  if (!city) return;

  const hero = $("#hero");
  $('#suggest').classList.remove('open');
  $("#city-input").setAttribute("aria-expanded", "false");

  hero.classList.add("shimmer");
  hero.innerHTML = `<div style="padding:34px 22px;">
      <p class="eyebrow">Looking up ${esc(city)}…</p>
    </div>`;
  $("#forecast").hidden = true;

  const [wRes, fRes] = await Promise.allSettled([apiWeather(city), apiForecast(city)]);

  const w = wRes.status === "fulfilled" ? wRes.value : null;
  const f = fRes.status === "fulfilled" ? fRes.value : null;

  if (!w || !f) {
    hero.classList.remove("shimmer");
    renderNotice(hero, "bad", "Offline", "The weather service could not be reached. Check your connection and try again.");
    return;
  }
  if (w.status === 401 || f.status === 401) {
    hero.classList.remove("shimmer");
    renderNotice(hero, "bad", "API key rejected",
      (w.body && w.body.message) || (f.body && f.body.message) ||
      "Your OpenWeather API key is invalid. Check the API_KEY in your .env file.");
    return;
  }
  if (w.status === 429 || f.status === 429) {
    hero.classList.remove("shimmer");
    renderNotice(hero, "bad", "Rate limit",
      (w.body && w.body.message) || (f.body && f.body.message) ||
      "OpenWeather is throttling requests. Wait a minute and try again.");
    return;
  }
  if (w.status === 404 || f.status === 404) {
    hero.classList.remove("shimmer");
    renderNotice(hero, "bad", "Not found", `We couldn't find a place named “${esc(city)}”. Try a city, e.g. “London” or “São Paulo”.`);
    return;
  }
  if (w.status >= 500 || f.status >= 500) {
    hero.classList.remove("shimmer");
    renderNotice(hero, "bad", "Service error", "The weather service returned an error. Please try again in a moment.");
    return;
  }

  state.weather = w.body;
  state.results = (f.body && f.body.days) || [];
  renderHero();
  renderForecast();
  refreshHistory();
  toast(`Showing ${state.weather.city}`);
}

function renderNotice(hero, tone, title, msg) {
  hero.innerHTML = `<div class="notice" data-tone="${tone}">
      <span class="nt">${title}</span>
      <div style="flex:1;"><p>${msg}</p>
        <button class="ghost-btn" type="button" onclick="search(document.getElementById('city-input').value)">Try again</button>
      </div>
    </div>`;
}

/* ---------- history ---------- */
async function refreshHistory() {
  const entries = await apiHistory();
  state.mockHistory = entries;
  renderHistory(entries);
}
$("#clear-history").addEventListener("click", async () => {
  await apiClearHistory();
  refreshHistory();
  toast("History cleared");
});

/* ---------- autocomplete ---------- */
let deTimer = null;
$("#city-input").addEventListener("input", () => {
  clearTimeout(deTimer);
  const q = $("#city-input").value.trim();
  if (q.length < 2) { closeSuggest(); return; }
  deTimer = setTimeout(async () => {
    const results = await apiSuggest(q);
    state.results = results;
    if (!results.length) { closeSuggest(); return; }
    state.suggestIndex = -1;
    $("#suggest").innerHTML = results.map((r, i) =>
      `<button type="button" role="option" data-i="${i}">
         <span class="loc">${esc(r.name)}</span>
         ${r.state ? `<span class="sub">${esc(r.state)}</span>` : ""}
         <span class="sub">${esc(r.country || "")}</span>
       </button>`).join("");
    $("#suggest").classList.add("open");
    $("#city-input").setAttribute("aria-expanded", "true");
    $$("#suggest button").forEach((b) => b.addEventListener("click", () => {
      pickSuggest(b.dataset.i);
    }));
  }, 220);
});

function pickSuggest(i) {
  const r = state.results[+i];
  if (!r) return;
  closeSuggest();
  $("#city-input").value = r.name;
  search(r.name);
}
function closeSuggest() {
  $("#suggest").classList.remove("open");
  $("#suggest").innerHTML = "";
  $("#city-input").setAttribute("aria-expanded", "false");
}
$("#city-input").addEventListener("keydown", (e) => {
  const open = $("#suggest").classList.contains("open");
  if (!open) return;
  const items = $$("#suggest button");
  if (!items.length) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    state.suggestIndex = (state.suggestIndex + 1) % items.length;
    highlight(items);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    state.suggestIndex = (state.suggestIndex - 1 + items.length) % items.length;
    highlight(items);
  } else if (e.key === "Enter" && state.suggestIndex >= 0) {
    e.preventDefault();
    pickSuggest(state.suggestIndex);
  } else if (e.key === "Escape") {
    closeSuggest();
  }
});
function highlight(items) {
  items.forEach((b, i) => b.setAttribute("aria-selected", String(i === state.suggestIndex)));
  items[state.suggestIndex]?.scrollIntoView({ block: "nearest" });
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".searchbar")) closeSuggest();
});

/* ---------- form submit + unit toggle ---------- */
$("#search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  search($("#city-input").value);
});
$$(".unit-toggle button").forEach((b) => b.addEventListener("click", () => {
  state.unit = b.dataset.unit;
  $$(".unit-toggle button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  rerenderTemps();
}));
function rerenderTemps() {
  $$(".temp[data-c]").forEach((el) => {
    el.innerHTML = temp(+el.dataset.c) + '<span class="deg">°</span>';
  });
  $$("[data-c]").forEach((el) => {
    if (el.classList.contains("temp")) return;
    el.textContent = temp(+el.dataset.c);
  });
  $$("#forecast .d-high,#forecast .d-low").forEach((el) => {
    el.textContent = temp(+el.dataset.c) + "°";
  });
  const f = $("#forecast");
  if (f) {
    const w = state.weather;
    if (w) f.querySelector(".head h2").textContent = `Five-day outlook · ${w.city}`;
  }
  const feel = $("#hero .feels b");
  if (feel) feel.textContent = temp(+feel.dataset.c) + "°";
  const wind = $("#hero .instrument:nth-of-type(3) .num");
  if (wind && state.weather) wind.innerHTML = fmtWind(state.weather.wind_ms) + "<small>m/s</small>";
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- storage (safe in sandboxed viewers) ---------- */
function loadStorage(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (err) { return fallback; }
}
function saveStorage(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* ignore */ }
}

      sunrise: c.rise, sunset: c.set, searched_at: new Date().toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", year: "numeric" }),
    }};
  },
  forecast(city) {
    const c = MOCK.find(city);
    const base = new Date();
    const icons = ["10d", "13d", "02d", "03d", "01d"];
    const days = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      days.push({
        date: d.toISOString().slice(0, 10),
        icon: icons[i],
        condition: ["Light Rain", "Snow", "Few Clouds", "Scattered Clouds", "Clear Sky"][i],
        temp_min_c: c.temp - 5 + i - 1,
        temp_max_c: c.temp + 2 + i,
        humidity: c.humid + i * 2,
        wind_ms: c.wind + i * 0.5,
      });
    }
    return { status: 200, body: { city: c.name, country: c.country, days } };
  },
  suggest(q) {
    const needle = q.toLowerCase();
    return Object.values(MOCK_CITY)
      .filter((c) => c.name.toLowerCase().includes(needle))
      .slice(0, 5)
      .map((c) => ({ name: c.name, country: c.country }));
  },
};

/* ---------- boot ---------- */
refreshHistory();
</script>
